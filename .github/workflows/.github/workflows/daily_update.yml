name: Ofoq Daily Data Pipeline

on:
  schedule:
    # يعمل كل يوم الساعة 00:00 UTC (3:00 صباحاً بتوقيت فلسطين)
    - cron: '0 0 * * *'
  workflow_dispatch:  # يسمح لك بتشغيله يدوياً

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Run data pipeline
      run: python pipeline.py
      
    - name: Commit and push changes
      run: |
        git config --global user.name 'Ofoq Bot'
        git config --global user.email 'bot@ofoq.ps'
        git add data/
        git commit -m "تحديث تلقائي: $(date +'%Y-%m-%d')" || echo "لا تغييرات"
        git push
